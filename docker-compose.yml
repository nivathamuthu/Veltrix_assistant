services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false # falls back to the defaults in app/config.py
    environment:
      # Pin the data locations to the mount, whatever .env says.
      CORPUS_DIR: ./data/corpus
      MANIFEST_PATH: ./data/manifest.json
      DB_PATH: ./data/veltrix.db
      INDEX_DIR: ./index
      # Where the image keeps the model downloaded at build time (a .env that
      # says ./models must not override it).
      EMBED_CACHE_DIR: /opt/models
    volumes:
      - ./data:/app/data # replaced by the evaluator's own copy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped
